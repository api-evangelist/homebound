name: Homebound
description: >-
  Homebound is a tech-enabled, personalized homebuilder that pairs a proprietary
  software platform with a managed network of trade partners to build homes on a
  customer's lot, sell finished and in-progress inventory homes, and run disaster
  rebuild programs — most notably wildfire recovery in California. Homeowners
  track budget, schedule, documents, and construction progress through a
  Homeowner Portal. Backed by Fifth Wall, Forerunner Ventures, and GV, Homebound
  operates in the construction-tech sector. Homebound does not publish a public
  developer API or developer portal; its public engineering footprint is the
  homebound-team GitHub organization and the first-party open-source packages it
  publishes to the @homebound npm scope (the Beam design system, form-state, and
  truss). This profile was added to the API Evangelist network as a VC-portfolio
  lead and enriched from public company surfaces.
